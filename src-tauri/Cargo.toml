[package]
name = "opencode-monitor"
version = "1.5.5"
edition = "2021"
description = "Desktop dashboard for monitoring opencode AI assistant usage"
authors = ["chandupahashen"]
repository = "https://github.com/chandupahashen/opencode-monitor"
license = "MIT"
keywords = ["tauri", "opencode", "dashboard", "ai", "monitor"]
categories = ["development-tools"]

[lib]
name = "opencode_monitor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
once_cell = "1"
